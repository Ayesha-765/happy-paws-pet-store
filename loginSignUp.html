<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Paws Login & Signup</title>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>

<div class="container">
  <h1>🐾 Happy Paws</h1>
  <p class="tagline">Adopt Love. Save Lives.</p>


  <!-- LOGIN FORM -->
  <form id="loginForm">
    <h3>Login</h3>

    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

    <p class="switch-form">New user? <a onclick="showSignup()">Signup</a></p>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" class="hide">
    <h3>Create Account</h3>

    <input type="text" name="name" placeholder="Full Name" required class="input-field">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="password" name="cpassword" placeholder="Confirm Password" required>

    <button type="submit">Signup</button>

    <p class="switch-form">Already registered? <a onclick="showLogin()">Login</a></p>
  </form>
</div>

<script src="js/signup.js"></script>
</body>
</html>
